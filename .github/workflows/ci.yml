name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - run: go mod tidy
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee test.log
      - run: go vet ./...
      - run: make build
      - name: Upload failed test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
